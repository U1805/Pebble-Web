[package]
name = "pebble-web"
version = "0.1.0"
edition = "2021"
description = "Web service for Pebble — command-style HTTP backend sharing the Pebble core crates"
license = "AGPL-3.0-only"

[dependencies]
pebble-core = { path = "../crates/pebble-core" }
pebble-store = { path = "../crates/pebble-store" }
pebble-search = { path = "../crates/pebble-search" }
pebble-crypto = { path = "../crates/pebble-crypto" }
pebble-mail = { path = "../crates/pebble-mail" }
pebble-privacy = { path = "../crates/pebble-privacy" }

axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
uuid = { workspace = true }