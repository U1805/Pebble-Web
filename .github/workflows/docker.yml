name: Docker

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Image version, for example 0.1.4
        required: true
        default: 0.1.4

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build and publish Web image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate image version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Image versions must use MAJOR.MINOR.PATCH, got '$REQUESTED_VERSION'." >&2
            exit 1
          fi

          package_version="$(jq -r .version package.json)"
          if [[ "$package_version" != "$version" ]]; then
            echo "package.json version '$package_version' does not match image version '$version'." >&2
            exit 1
          fi

          echo "PEBBLE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.PEBBLE_VERSION }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src-web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
